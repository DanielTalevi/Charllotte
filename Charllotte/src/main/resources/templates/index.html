<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Teste</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        button:hover {
            background: #0ea5e9;
            transform: translateY(-2px);
        }
        #contador {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #f1f5f9;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>✅ Página de Teste</h1>
    <p>Se você está vendo isso funcionando corretamente, o HTML, CSS e JavaScript estão carregando sem problemas.</p>
    <button onclick="incrementar()">Clique aqui</button>
    <div id="contador">Cliques: 0</div>
</div>

<script>
    let cliques = 0;
    function incrementar() {
        cliques++;
        document.getElementById('contador').textContent = 'Cliques: ' + cliques;
    }
</script>
</body>
</html>
