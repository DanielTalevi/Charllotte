<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Charllotte</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #151a21;
        }

        .logo p {
            margin-top: 6px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-bottom: 18px;
            padding: 10px;
            border-radius: 7px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 14px;
            text-align: center;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <h1>Charllotte</h1>
        <p>Entre na sua conta</p>
    </div>

    <!-- Mensagem de erro -->
    <div
            class="error"
            th:if="${erro}"
            th:text="${erro}">
    </div>

    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label for="email">Email</label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>

            <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="••••••••"
                    required>
        </div>

        <button
                type="submit"
                class="login-button">
            Entrar
        </button>

    </form>

    <div class="footer">
        © 2026 Charllotte
    </div>

</div>

</body>
</html>
